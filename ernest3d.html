<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ernest en 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08131c">
  <link rel="icon" href="./icons/icon-192.png">
  <style>
    :root{--fg:#efe6d2;--fg2:#a9b5a3;--amber:#f2b23d;--line:#243b31;color-scheme:dark}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:#08131c;color:var(--fg);font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
    canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    .top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .title{font-family:Georgia,serif;font-size:20px;line-height:1.15}
    .title small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
    .panel{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(8,19,28,0),rgba(8,19,28,.88) 35%);display:flex;flex-direction:column;gap:8px;align-items:center}
    .seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
    .seg button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(18,32,26,.85);font-size:13px}
    .seg button.on{border-color:var(--amber);color:var(--amber);background:rgba(242,178,61,.12)}
    .hint{font-size:11.5px;color:var(--fg2);text-align:center}
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }</script>
</head>
<body>
  <div class="top"><div class="title"><small>Maquette 3D</small>Ernest</div></div>
  <div class="panel">
    <div class="seg" id="pose"><button data-p="attend" class="on">Attend</button><button data-p="salue">Salue</button><button data-p="arrose">Arrose</button><button data-p="lanterne">Lanterne</button><button data-p="dort">Dort</button><button data-p="marche">Marche</button></div>
    <div class="seg" id="time"><button data-t="day">Jour</button><button data-t="dusk" class="on">Soir</button><button data-t="night">Nuit</button></div>
    <div class="seg" id="cam"><button data-c="orbit" class="on">Portrait</button><button data-c="third">3ᵉ personne</button><button data-c="first">1ʳᵉ personne</button></div>
    <div class="hint" id="hint">Glisse pour tourner autour, pince pour approcher.</div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createErnest } from './js/ernest3d.js';

    const q = new URLSearchParams(location.search);
    const canvas = document.createElement('canvas'); document.body.prepend(canvas);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: q.has('shot') });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.02, 80);
    const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.target.set(0, 0.45, 0); controls.minDistance = 0.8; controls.maxDistance = 7; controls.maxPolarAngle = 1.5;
    camera.position.set(1.2, 0.95, 2.6);

    // ciel en dégradé + environnement réfléchi (PMREM)
    const skyU = { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, glow: { value: new THREE.Color() } };
    const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: skyU,
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 bot; uniform vec3 glow; varying vec3 vP; void main(){ float h = clamp(vP.y*1.3+0.2,0.0,1.0); vec3 c = mix(bot, top, h); c += glow * pow(max(dot(vP, normalize(vec3(-0.6,0.15,-0.8))),0.0), 6.0) * 0.8; gl_FragColor = vec4(c,1.0); }' });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), skyMat));
    const pmrem = new THREE.PMREMGenerator(renderer); let envRT = null;
    const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(5, 32, 16), skyMat));
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(3, 2), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })); panel.position.set(2, 3, 3); panel.lookAt(0, 0, 0); envScene.add(panel);

    const hemi = new THREE.HemisphereLight(0xbfe3f0, 0x2a2416, 0.7); scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff1d6, 2.6); key.position.set(2.5, 4, 3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, far: 12 }); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02; key.shadow.radius = 3; scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fd0ff, 1.6); rim.position.set(-2.5, 2.2, -3); scene.add(rim);
    scene.fog = new THREE.Fog(0x08131c, 6, 30);

    // ---- Socle de diorama : terre, herbe, dalles, pot, champignons, touffes, lucioles ----
    const rng = (() => { let a = 12345; return () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; })();
    const R = 2.0;
    const soil = new THREE.Mesh(new THREE.CylinderGeometry(R, R * 0.92, 0.35, 96, 4), new THREE.MeshStandardMaterial({ color: 0x4a3422, roughness: 1 }));
    { const p = soil.geometry.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); if (y < 0.17) { const a = Math.atan2(p.getZ(i), p.getX(i)); const k = 1 + Math.sin(a * 13) * 0.012 + Math.sin(a * 29) * 0.008; p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); } } soil.geometry.computeVertexNormals(); }
    soil.position.y = -0.175; soil.receiveShadow = true; scene.add(soil);
    const grassTop = new THREE.Mesh(new THREE.CircleGeometry(R * 1.005, 96), new THREE.MeshStandardMaterial({ color: 0x3f6a33, roughness: 0.95 })); grassTop.rotation.x = -Math.PI / 2; grassTop.position.y = 0.001; grassTop.receiveShadow = true; scene.add(grassTop);
    // dalles
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x9a9384, roughness: 0.9 });
    const stones = [];
    for (let i = 0; i < 9; i++) { const z = 1.6 - i * 0.42, x = Math.sin(i * 0.7) * 0.22 + 0.05; if (Math.hypot(x, z) < 0.35) continue; const g = new THREE.CylinderGeometry(0.2 + rng() * 0.05, 0.22, 0.04, 9); g.scale(1, 1, 0.8 + rng() * 0.3); const s = new THREE.Mesh(g, stoneMat); s.position.set(x, 0.01, z); s.rotation.y = rng() * 3; s.receiveShadow = s.castShadow = true; scene.add(s); stones.push([x, z]); }
    // herbe : brins instanciés qui ondulent
    const bladeGeo = new THREE.PlaneGeometry(0.016, 0.07, 1, 3); bladeGeo.translate(0, 0.035, 0);
    { const p = bladeGeo.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 0.07; p.setX(i, p.getX(i) * (1 - y)); p.setZ(i, y * y * 0.03); } }
    const windU = { value: 0 };
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, side: THREE.DoubleSide });
    bladeMat.onBeforeCompile = (s) => { s.uniforms.uT = windU; s.vertexShader = 'uniform float uT;\n' + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n float hh = position.y / 0.07; vec4 wp = instanceMatrix * vec4(0.,0.,0.,1.); transformed.x += sin(uT*1.6 + wp.x*2.0 + wp.z*1.3) * 0.025 * hh * hh; transformed.z += cos(uT*1.3 + wp.x*1.7) * 0.015 * hh * hh;'); };
    const NB = 9000, blades = new THREE.InstancedMesh(bladeGeo, bladeMat, NB); blades.receiveShadow = true;
    { const d = new THREE.Object3D(), c = new THREE.Color(); let n = 0; while (n < NB) { const r = Math.sqrt(rng()) * (R - 0.04), a = rng() * 6.283, x = Math.cos(a) * r, z = Math.sin(a) * r; if (stones.some(([sx, sz]) => Math.hypot(x - sx, z - sz) < 0.2)) continue; d.position.set(x, 0, z); d.rotation.set((rng() - 0.5) * 0.4, rng() * 6.28, (rng() - 0.5) * 0.4); d.scale.setScalar(0.6 + rng() * 0.9); d.updateMatrix(); blades.setMatrixAt(n, d.matrix); c.setHSL(0.24 + rng() * 0.06, 0.45 + rng() * 0.2, 0.22 + rng() * 0.14); blades.setColorAt(n, c); n++; } }
    scene.add(blades);
    // pot de thym (cible de l'arrosoir)
    const terra = new THREE.MeshStandardMaterial({ color: 0xb4652a, roughness: 0.9 });
    const pot = new THREE.Group(); pot.position.set(0.42, 0, 0.42); scene.add(pot);
    { const g = new THREE.LatheGeometry([[0.09, 0], [0.12, 0.18], [0.135, 0.19], [0.135, 0.23], [0.12, 0.23], [0.11, 0.2]].map(([x, y]) => new THREE.Vector2(x, y)), 40); const m = new THREE.Mesh(g, terra); m.castShadow = m.receiveShadow = true; pot.add(m);
      const sl = new THREE.Mesh(new THREE.CircleGeometry(0.112, 24), new THREE.MeshStandardMaterial({ color: 0x3a2818 })); sl.rotation.x = -Math.PI / 2; sl.position.y = 0.205; pot.add(sl);
      const lm = new THREE.MeshStandardMaterial({ color: 0x5f8f4a, roughness: 0.7 }); for (let i = 0; i < 26; i++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.03 + rng() * 0.02, 8, 6), lm); const a = rng() * 6.28, r = rng() * 0.08; b.position.set(Math.cos(a) * r, 0.23 + rng() * 0.12, Math.sin(a) * r); b.castShadow = true; pot.add(b); } }
    // champignons
    const capM = new THREE.MeshStandardMaterial({ color: 0xb8442e, roughness: 0.6 }), stemM = new THREE.MeshStandardMaterial({ color: 0xefe3c8, roughness: 0.8 }), dotM = new THREE.MeshStandardMaterial({ color: 0xfff6e0 });
    for (const [x, z, s] of [[-0.9, -0.5, 1], [-1.0, -0.35, 0.6], [1.1, -0.8, 0.8]]) { const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); const st = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.14, 12), stemM); st.position.y = 0.07; const cp = new THREE.Mesh(new THREE.SphereGeometry(0.09, 20, 12, 0, 6.29, 0, 1.6), capM); cp.position.y = 0.13; cp.scale.y = 0.75; for (let i = 0; i < 6; i++) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 4), dotM); const a = i * 1.1, e = 0.5 + (i % 3) * 0.3; d.position.set(Math.sin(e) * Math.cos(a) * 0.09, 0.13 + Math.cos(e) * 0.068, Math.sin(e) * Math.sin(a) * 0.09); g.add(d); } for (const m of [st, cp]) { m.castShadow = true; g.add(m); } scene.add(g); }
    // rochers moussus
    for (const [x, z, s] of [[-1.3, 0.6, 0.25], [1.25, 0.7, 0.18], [-0.4, -1.4, 0.3]]) { const g = new THREE.IcosahedronGeometry(s, 1); const p = g.attributes.position; for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) * (1 + Math.sin(i) * 0.08), p.getY(i) * 0.7, p.getZ(i)); g.computeVertexNormals(); const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x7c7a6c, roughness: 0.95, flatShading: true })); m.position.set(x, s * 0.25, z); m.castShadow = m.receiveShadow = true; scene.add(m); }
    // lucioles
    const ffN = 40, ffGeo = new THREE.BufferGeometry(), ffPos = new Float32Array(ffN * 3), ffSeed = [];
    for (let i = 0; i < ffN; i++) ffSeed.push([(rng() - 0.5) * 3.6, 0.2 + rng() * 1.2, (rng() - 0.5) * 3.6, rng() * 10]);
    ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
    const ffC = document.createElement('canvas'); ffC.width = ffC.height = 32; { const x = ffC.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, 'rgba(255,240,170,1)'); g.addColorStop(0.3, 'rgba(242,178,61,.6)'); g.addColorStop(1, 'rgba(242,178,61,0)'); x.fillStyle = g; x.fillRect(0, 0, 32, 32); }
    const ffMat = new THREE.PointsMaterial({ size: 0.07, map: new THREE.CanvasTexture(ffC), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
    scene.add(new THREE.Points(ffGeo, ffMat));

    // ---- Ernest ----
    const E = createErnest({ scale: 0.33 }); scene.add(E.root); E.attach(scene); window.E = E;
    E.root.position.set(0, 0, 0.05);

    // 1re personne : la lanterne tenue devant soi, comme dans un jeu (accrochée à la caméra, balancement de la marche)
    scene.add(camera);
    const fpLantern = E.parts.lantern.clone(true); fpLantern.scale.setScalar(0.33 * 1.15); fpLantern.visible = false; camera.add(fpLantern);
    const fpLight = fpLantern.getObjectByProperty('isPointLight', true);
    // ---- Ambiances ----
    const TIMES = {
      day: { top: '#6a9cc0', bot: '#dfe6cf', glow: '#fff1c8', hemi: 0.75, key: 2.8, keyC: '#fff1d6', rim: 0.8, exp: 1.0, ff: 0, lantern: 0.0 },
      dusk: { top: '#1b2c44', bot: '#7d6a5e', glow: '#e89a60', hemi: 0.55, key: 2.0, keyC: '#ffc890', rim: 1.6, exp: 1.1, ff: 0.6, lantern: 0.8 },
      night: { top: '#050c18', bot: '#11253a', glow: '#3a5a8a', hemi: 0.35, key: 0.6, keyC: '#9ab8ff', rim: 1.2, exp: 1.25, ff: 1, lantern: 1.4 },
    };
    let time = q.get('t') || 'dusk', lanternK = 0.8;
    function setTime(tn) {
      time = tn; const T = TIMES[tn]; skyU.top.value.set(T.top); skyU.bot.value.set(T.bot); skyU.glow.value.set(T.glow);
      hemi.intensity = T.hemi; key.intensity = T.key; key.color.set(T.keyC); rim.intensity = T.rim; renderer.toneMappingExposure = T.exp; ffMat.opacity = T.ff; lanternK = T.lantern;
      scene.fog.color.set(T.top); if (envRT) envRT.dispose(); envRT = pmrem.fromScene(envScene, 0.03); scene.environment = envRT.texture;
      document.querySelectorAll('#time button').forEach((b) => b.classList.toggle('on', b.dataset.t === tn));
    }
    setTime(time);

    // ---- Poses et caméras ----
    let pose = q.get('p') || 'attend', cam = q.get('c') || 'orbit', walking = false, ang = 0;
    function setPose(p) { pose = p; walking = p === 'marche'; E.setPose(walking ? 'attend' : p); E.setWalk(walking ? 1 : 0); document.querySelectorAll('#pose button').forEach((b) => b.classList.toggle('on', b.dataset.p === p)); if (!walking && cam === 'orbit') { E.root.position.set(0, 0, 0.05); E.root.rotation.y = p === 'arrose' ? 0.75 : 0; } }
    function setCam(c) { cam = c; controls.enabled = c === 'orbit'; camera.fov = c === 'first' ? 68 : c === 'third' ? 45 : 32; camera.updateProjectionMatrix(); E.firstPerson(c === 'first'); if (c !== 'orbit') setPose('marche'); document.querySelectorAll('#cam button').forEach((b) => b.classList.toggle('on', b.dataset.c === c)); document.getElementById('hint').textContent = c === 'orbit' ? 'Glisse pour tourner autour, pince pour approcher.' : c === 'third' ? 'Caméra au-dessus de l’épaule : un joystick au pouce, l’autre pouce pour regarder.' : 'Tu vois par ses yeux : le bord du chapeau, la lanterne au bout du bras.'; }
    document.getElementById('pose').onclick = (e) => { const b = e.target.closest('button'); if (b) setPose(b.dataset.p); };
    document.getElementById('time').onclick = (e) => { const b = e.target.closest('button'); if (b) setTime(b.dataset.t); };
    document.getElementById('cam').onclick = (e) => { const b = e.target.closest('button'); if (b) setCam(b.dataset.c); };
    setPose(pose); setCam(cam);
    if (q.has('az')) { const a = parseFloat(q.get('az')), d = parseFloat(q.get('d') || '2.6'), h = parseFloat(q.get('h') || '0.9'); camera.position.set(Math.sin(a) * d, h, Math.cos(a) * d); controls.target.set(0, parseFloat(q.get('ty') || '0.45'), 0); }
    if (q.has('ui')) document.querySelectorAll('.panel,.top').forEach((el) => (el.style.display = 'none'));

    function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();

    const clock = new THREE.Clock(); let T = 0;
    const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmp = new THREE.Vector3();
    function frame(dt) {
      T += dt; windU.value = T;
      if (walking) { // il fait le tour du socle
        ang += dt * 0.32; const r = 1.05; E.root.position.set(Math.sin(ang) * r, 0, Math.cos(ang) * r); E.root.rotation.y = ang + Math.PI / 2;
      }
      E.update(dt, { lantern: time !== 'day' && cam !== 'first' && (walking || pose === 'lanterne'), lanternK });
      fpLantern.visible = cam === 'first' && time !== 'day'; if (fpLantern.visible) { fpLantern.position.set(0.12 + Math.sin(T * 2.6) * 0.006, -0.035 + Math.abs(Math.cos(T * 2.6)) * 0.008, -0.32); fpLantern.rotation.set(Math.sin(T * 2.6) * 0.06, 0, Math.sin(T * 1.3) * 0.08); fpLight.intensity = lanternK * 1.4 * (1 + Math.sin(T * 13) * 0.06 + Math.sin(T * 7.3) * 0.08); }
      for (let i = 0; i < ffN; i++) { const s = ffSeed[i]; ffPos[i * 3] = s[0] + Math.sin(T * 0.4 + s[3]) * 0.2; ffPos[i * 3 + 1] = s[1] + Math.sin(T * 0.7 + s[3] * 2) * 0.1; ffPos[i * 3 + 2] = s[2] + Math.cos(T * 0.35 + s[3]) * 0.2; }
      ffGeo.attributes.position.needsUpdate = true; ffMat.size = 0.05 + Math.sin(T * 3) * 0.01;
      if (cam === 'third') {
        const yaw = E.root.rotation.y; tmp.set(-Math.sin(yaw) * 1.7 - Math.cos(yaw) * 0.38, 1.0, -Math.cos(yaw) * 1.7 + Math.sin(yaw) * 0.38).add(E.root.position);
        camPos.lerp(tmp, 1 - Math.exp(-dt * 4)); if (camPos.lengthSq() === 0) camPos.copy(tmp); camera.position.copy(camPos);
        tmp.set(Math.sin(yaw) * 1.0, 0.3, Math.cos(yaw) * 1.0).add(E.root.position); camLook.lerp(tmp, 1 - Math.exp(-dt * 5)); if (camLook.lengthSq() === 0) camLook.copy(tmp); camera.lookAt(camLook);
      } else if (cam === 'first') {
        E.root.updateMatrixWorld(true); E.eyeWorld(camera.position); const yaw = E.root.rotation.y; tmp.set(Math.sin(yaw) * 2 + E.root.position.x, 0.2, Math.cos(yaw) * 2 + E.root.position.z); camera.lookAt(tmp);
      } else controls.update();
      renderer.render(scene, camera);
    }
    if (q.has('shot')) { for (let i = 0; i < Number(q.get('shot') || 90); i++) frame(1 / 30); window.__ready = true; window.__cam = camera; }
    else renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.05)));
  </script>
</body>
</html>
