<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ernest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1511">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ernest">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }</script>
</head>
<body>
  <header class="serre" id="serre">
    <canvas id="garden"></canvas>
    <canvas id="garden3d" hidden></canvas>
    <div class="e-wrap" id="ernestWrap"></div>
    <div class="bulle" id="bulle" hidden></div>
    <button class="gear undo-btn" id="btnUndo" aria-label="Annuler la dernière action" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14.5 4.5 10 9 5.5"/><path d="M4.5 10H14a5.5 5.5 0 0 1 0 11h-3"/></svg></button>
    <button class="gear help-btn" id="btnHelp" aria-label="Visite"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.5a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.6" r=".9" fill="currentColor"/></svg></button>
    <button class="gear" id="btnSettings" aria-label="Réglages"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"/><circle cx="15" cy="7.5" r="2"/><circle cx="9" cy="16.5" r="2"/></svg></button>
  </header>
  <main id="view" class="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"/></svg>Aujourd'hui</button>
    <button data-tab="liste"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><circle cx="5" cy="6.5" r=".9" fill="currentColor"/><circle cx="5" cy="12" r=".9" fill="currentColor"/><circle cx="5" cy="17.5" r=".9" fill="currentColor"/></svg>Liste</button>
    <button data-tab="semaine"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v3.5M16 3v3.5"/><circle cx="8.5" cy="14.5" r=".9" fill="currentColor"/><circle cx="12" cy="14.5" r=".9" fill="currentColor"/></svg>Semaine</button>
    <button data-tab="carnet"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10.5a1.5 1.5 0 0 1 1.5 1.5v15H8a2.5 2.5 0 0 1-2.5-2.5V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M5.5 17.5A2.5 2.5 0 0 1 8 15h11M10 8h5.5"/></svg>Carnet</button>
  </nav>
  <button class="fab" id="fab" aria-label="Ajouter"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
  <div class="sheet-bg" id="sheetBg" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <div class="toast" id="toast" hidden></div>
  <div class="serre-full" id="serreFull" hidden>
    <button class="sf-close" id="serreClose" aria-label="Revenir"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>Ernest</button>
    <div class="sf-pick" id="sfPick"><button data-house="all" class="on">Tout</button><button data-house="perso">Vie perso</button><button data-house="travail">Travail</button><button data-house="bienetre">Bien-être</button></div>
    <div class="sf-cap" id="sfCap"></div>
    <div class="sf-walk"><button id="sfView" hidden>1ʳᵉ personne</button><button id="sfWalk">Promenade</button></div>
    <div class="sf-joy" id="sfJoy" hidden aria-label="Joystick"><i></i></div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
