<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ernest · la maison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html,body{margin:0;height:100%;background:#08131c;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
    canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
    #tog{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;border-radius:999px;border:1px solid #f2b23d;background:rgba(11,21,17,.75);color:#efe6d2;font:inherit;font-size:14px;cursor:pointer}
    #info{position:fixed;left:12px;top:10px;color:#a9b5a3;font:11px ui-monospace,monospace}
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }
  </script>
</head>
<body>
  <button id="tog">Nuit</button>
  <div id="info"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { buildCottage } from './js/cottage3d.js';

    const rngOf = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
    const qp = new URLSearchParams(location.search);
    camera.position.fromArray((qp.get('cam') || '4.6,2.9,6.4').split(',').map(Number));
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.fromArray((qp.get('tgt') || '0,1.5,0').split(',').map(Number)); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xbfe3f0, 0x3a3020, 1.0); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff1d6, 2.4);
    sun.position.set(6, 10, 5); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 6, bottom: -4, far: 30 });
    sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.02; scene.add(sun);

    const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardMaterial({ color: 0x4d6e35, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    const M = {
      wood: new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: 0.85 }),
      woodDark: new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.9 }),
      terra: new THREE.MeshStandardMaterial({ color: 0xb4652a, roughness: 0.9 }),
      stone: new THREE.MeshStandardMaterial({ color: 0x8c8676, roughness: 0.95 }),
      leaf: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65, side: THREE.DoubleSide }),
      stem: new THREE.MeshStandardMaterial({ color: 0x3f6b3a, roughness: 0.8 }),
      bark: new THREE.MeshStandardMaterial({ color: 0x5b3f26, roughness: 0.95 }),
    };
    const cottage = buildCottage(THREE, { rng: rngOf(42), M });
    scene.add(cottage.group);
    const marker = new THREE.Mesh(new THREE.SphereGeometry(0.04), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    marker.position.copy(cottage.smokeOrigin); marker.visible = false; cottage.group.add(marker);
    const box = new THREE.Box3(), tmp = new THREE.Box3(), im4 = new THREE.Matrix4();
    cottage.group.updateMatrixWorld(true);
    cottage.group.traverse((o) => { if (!o.isMesh) return; o.geometry.computeBoundingBox();
      if (o.isInstancedMesh) for (let i = 0; i < o.count; i++) { o.getMatrixAt(i, im4); box.union(tmp.copy(o.geometry.boundingBox).applyMatrix4(im4.premultiply(o.matrixWorld))); }
      else box.union(tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld)); });
    const sz = box.getSize(new THREE.Vector3());
    document.getElementById('info').textContent = `meshes ${cottage.group.userData.meshCount} · ${sz.x.toFixed(2)} × ${sz.z.toFixed(2)} × ${sz.y.toFixed(2)} m`;
    window.__cottage = { meshes: cottage.group.userData.meshCount, size: sz.toArray(), min: box.min.toArray(), max: box.max.toArray(), smoke: cottage.smokeOrigin.toArray() };

    let night = new URLSearchParams(location.search).has('night') ? 1 : 0, nightCur = night;
    const btn = document.getElementById('tog');
    const setLabel = () => { btn.textContent = night ? 'Jour' : 'Nuit'; };
    btn.onclick = () => { night = night ? 0 : 1; setLabel(); }; setLabel();
    const dayBg = new THREE.Color(0x9cc7da), nightBg = new THREE.Color(0x0a1626);
    scene.fog = new THREE.Fog(0x9cc7da, 18, 60);

    const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
    addEventListener('resize', resize); resize();
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      nightCur += (night - nightCur) * 0.08;
      const n = nightCur;
      const bg = dayBg.clone().lerp(nightBg, n); scene.background = bg; scene.fog.color.copy(bg);
      sun.intensity = 2.4 * (1 - n) + 0.35 * n; sun.color.setHex(0xfff1d6).lerp(new THREE.Color(0x8fa6d8), n);
      hemi.intensity = 1.0 * (1 - n) + 0.22 * n; hemi.color.setHex(0xbfe3f0).lerp(new THREE.Color(0x3a5070), n);
      renderer.toneMappingExposure = 1 - n * 0.1;
      cottage.update(t, n);
      controls.update(); renderer.render(scene, camera);
    });
  </script>
</body>
</html>
